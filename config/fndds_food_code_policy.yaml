# ---------------------------------------------------------------------------
# Sequential ban policy (used when GA sequential_ban.plugin=fndds)
# Ablation switch lives in config/ga_multiobj_weights.yaml (plugin: none|fndds).
# ---------------------------------------------------------------------------
sequential_ban:
  # Exact food_id ban when day hits these majors (no family expand).
  # Typically same as main_cuisine, but configured separately.
  exact_ban_first_digits: ["2", "3"]
  # When false (default): only ban food_ids that appear on the day.
  # When true: also wipe entire family_prefixes / family_unit_kinds from the pool.
  expand_prefix_family: false
  # Used only if expand_prefix_family: true — ban ALL pool foods with the
  # same matched prefix when the day hits that prefix.
  family_prefixes:
    - "4"       # legumes / nuts / seeds — N+1 family ban (NOT main dish)
    - "57"      # RTE cereal (Fiber One / Cap'n / …)
    - "95"      # meal replacement / nutritional shake / protein powder (Herbalife, …)
    - "91745"   # hard candy / lollipop / cough drop / gumdrop
    - "118"     # dry milk / cocoa / milk-based powder (not reconstituted)
    - "929"     # dry fruit-beverage concentrates
    - "92191"   # coffee dry powder
    - "92291"   # Postum dry powder
    - "712"     # white potato chips (incl. fat-free) — N+1 family ban
    - "75232"   # seaweed dried/cooked — N+1 family ban
    - "54"      # crackers / crispbread family — N+1 family ban
    - "52215"   # corn / flour / WW tortillas (not tortilla chips 544*) — N+1 family ban
    - "511070"  # bread, French or Vienna (+ toasted) — N+1 family ban
    - "511550"  # roll, French or Vienna (+ toasted)
    - "513015"  # bread, French, whole wheat (homemade/bakery ± toasted)
  # If day hits any of these unit_kinds, ban ALL pool foods of that unit_kind
  family_unit_kinds:
    - "dry_powder"
    - "cracker"      # crispbread / crackers (54*) — same expand as prefix 54
  # Optional extra exact-id prefixes (no family expand) — empty for now
  exact_prefixes: []

# ---------------------------------------------------------------------------
# Unit kind hints for display-unit picker (scripts/build_food_portion_units.py)
# ---------------------------------------------------------------------------
unit_kind_by_prefix:
  # beverages / fluids → mL
  "111": liquid      # fluid cow milk
  "112": liquid      # evaporated / condensed (as used)
  "113": liquid      # non-dairy milk drinks
  "115": liquid      # flavored / chocolate milk
  "116": liquid
  "12": liquid       # cream / half-and-half
  "92": liquid       # coffee / tea (prepared)
  "93": liquid       # alcohol
  "94": liquid       # water
  # dry powders (not beverages) — longest prefix wins over "92"
  "118": dry_powder  # dry milk / cocoa / milk-based MR powder
  "92191": dry_powder
  "92291": dry_powder
  "929": dry_powder
  "952": dry_powder  # Herbalife / Slim Fast / protein powder mixes (not RTD 951)
  "951": liquid      # ready-to-drink nutritional shakes
  # solids with preferred count units
  "26": fish         # prefer fillet
  "51": bread        # household unit from FNDDS / yaml / grams_raw
  "52215": tortilla  # corn/flour tortilla (not chips 544*)
  "54": cracker      # prefer piece
  "57": cereal       # prefer cup
  "712": snack_chip  # white potato chips (not all 71* potatoes/salads)
  "71905": snack_chip  # plantain chips
  "71980": snack_chip  # taro chips
  "14": cheese
  "42": nuts
  "61": produce
  "62": produce
  "91745": other     # hard candy → keep count/g, not powder

# First-digit fallback when no longer prefix matches
unit_kind_by_major:
  "1": other
  "2": protein
  "3": protein
  "4": protein
  "5": grain
  "6": produce
  "7": produce
  "9": other
